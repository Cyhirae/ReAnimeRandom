<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Re:ANIME Random</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #080a08;
    --ink: #ececec;
    --acc: oklch(76.8% .233 130.85);
    --acc-soft: oklch(76.8% .233 130.85 / .16);
    --acc-ink: #04140a;
    --chamfer: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    --chamfer-sm: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
    --chamfer-xs: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 322px;
    background: var(--bg);
    background-image:
      radial-gradient(115% 65% at 100% 0%, oklch(76.8% .233 130.85 / .10), transparent 58%),
      radial-gradient(85% 55% at 0% 100%, oklch(76.8% .233 130.85 / .05), transparent 62%);
    color: var(--ink);
    font: 12.5px/1.45 "Inter Variable", Inter, system-ui, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------------------------------------------------------------- header */
  .hdr { display: flex; align-items: center; gap: 9px; padding: 12px 12px 9px; }
  .glyph {
    flex: none; width: 28px; height: 28px; display: grid; place-items: center;
    background: linear-gradient(155deg, oklch(76.8% .233 130.85 / .20), oklch(76.8% .233 130.85 / .03));
    box-shadow: inset 0 0 0 1px oklch(76.8% .233 130.85 / .32);
    color: var(--acc);
    clip-path: var(--chamfer-sm);
  }
  .glyph svg { width: 14px; height: 14px; }
  .hdr h1 {
    margin: 0; font-size: 11px; font-weight: 800; letter-spacing: 1.7px;
    text-transform: uppercase; color: #fff; line-height: 1;
  }
  .hdr .ver {
    margin-left: auto; font-size: 8.5px; font-weight: 700; letter-spacing: 1.1px;
    text-transform: uppercase; color: rgba(255, 255, 255, .24);
  }
  .sub {
    margin: 0 12px 11px; font-size: 10.5px; line-height: 1.5;
    color: rgba(255, 255, 255, .38);
  }

  /* ---------------------------------------------------------------- panels */
  .panel {
    margin: 0 12px 8px;
    background: linear-gradient(180deg, #111511, #0c0e0c);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, .07),
      inset 0 1px 0 rgba(255, 255, 255, .05),
      0 8px 20px rgba(0, 0, 0, .38);
    clip-path: var(--chamfer);
    padding: 1px 0 2px;
  }
  .p-lbl {
    display: flex; align-items: center; gap: 7px;
    padding: 9px 11px 5px;
    font-size: 9px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase;
    color: rgba(255, 255, 255, .33);
  }
  .p-lbl::before { content: ""; width: 3px; height: 9px; background: var(--acc); opacity: .85; }

  /* ------------------------------------------------------- selectable rows */
  .stack { display: grid; gap: 5px; padding: 2px 11px 8px; }
  .chip.wide {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 11px; text-align: left; text-transform: none;
    font-size: 12px; font-weight: 600; letter-spacing: .1px;
  }
  .chip.wide .tick { font-size: 11px; line-height: 1; color: var(--acc); opacity: 0; transition: opacity .14s ease; }
  .chip.wide[aria-pressed="true"] .tick { opacity: 1; }

  /* ----------------------------------------------------------- rating chips */
  .chips {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;
    padding: 3px 11px 10px;
  }
  .chips.fmt { grid-template-columns: repeat(6, 1fr); padding: 3px 11px 11px; }
  .chips.fmt .chip { padding: 9px 0; font-size: 10px; letter-spacing: .8px; text-transform: uppercase; grid-column: span 2; }
  .chips.fmt .chip:nth-child(4),
  .chips.fmt .chip:nth-child(5) { grid-column: span 3; }
  .chip {
    padding: 7px 0; border: 0; cursor: pointer;
    background: #161a16; color: rgba(255, 255, 255, .64);
    font: 800 10px/1 inherit; letter-spacing: .5px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07);
    clip-path: var(--chamfer-xs);
    transition: background .14s ease, color .14s ease, box-shadow .14s ease;
  }
  .chip:hover { color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .24); }
  .chip:active { transform: translateY(1px); }
  .chip[aria-pressed="true"] {
    background: var(--acc-soft); color: #fff;
    box-shadow: inset 0 0 0 1px oklch(76.8% .233 130.85 / .75);
  }
  .chip[aria-pressed="true"]:hover {
    color: #fff; background: oklch(76.8% .233 130.85 / .22);
    box-shadow: inset 0 0 0 1px oklch(76.8% .233 130.85 / .9);
  }

  /* ----------------------------------------------------------- segmented */
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 3px 11px 10px; }
  .seg button {
    padding: 8px 6px; border: 0; cursor: pointer;
    background: #161a16; color: rgba(255, 255, 255, .64);
    font: 800 10px/1.25 inherit; letter-spacing: .7px; text-transform: uppercase;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07);
    clip-path: var(--chamfer-xs);
    transition: background .14s ease, color .14s ease, box-shadow .14s ease;
  }
  .seg button:hover { color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .24); }
  .seg button:active { transform: translateY(1px); }
  .seg button[aria-pressed="true"] {
    background: var(--acc-soft); color: #fff;
    box-shadow: inset 0 0 0 1px oklch(76.8% .233 130.85 / .75);
  }
  .seg button[aria-pressed="true"]:hover {
    color: #fff; background: oklch(76.8% .233 130.85 / .22);
    box-shadow: inset 0 0 0 1px oklch(76.8% .233 130.85 / .9);
  }

  /* ---------------------------------------------------------------- footer */
  .foot { display: flex; align-items: center; gap: 7px; padding: 2px 12px 10px; }
  .btn {
    padding: 9px 13px; border: 0; cursor: pointer;
    font: 800 10.5px/1 inherit; letter-spacing: 1.1px; text-transform: uppercase;
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    transition: background .16s ease, color .16s ease, box-shadow .16s ease;
  }
  #reset {
    background: transparent; color: rgba(255, 255, 255, .55);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
  }
  #reset:hover { color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .34); }
  #reset:active { transform: translateY(1px); }
  #status {
    margin-left: auto; text-align: right; font-size: 9.5px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    color: rgba(255, 255, 255, .26);
    transition: color .18s ease;
  }
  #status.on { color: var(--acc); }

  .hint {
    padding: 0 12px 10px; font-size: 9px; letter-spacing: .9px;
    text-transform: uppercase; color: rgba(255, 255, 255, .22);
  }
  .hint b { color: rgba(255, 255, 255, .38); font-weight: 800; }
</style>
</head>
<body>
  <div class="hdr">
    <span class="glyph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
        <circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"></circle>
        <circle cx="15.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"></circle>
        <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"></circle>
        <circle cx="8.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"></circle>
        <circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"></circle>
      </svg>
    </span>
    <h1>Random anime</h1>
    <span class="ver">v1.4.7</span>
  </div>
  <p class="sub">Adds a dice button to the Re:ANIME header. Picks a random title from whichever formats you allow below.</p>

  <section class="panel">
    <div class="p-lbl">Include</div>
    <div class="chips fmt" id="formats"></div>
  </section>

  <section class="panel">
    <div class="p-lbl">Filters</div>
    <div class="stack" id="filters">
      <button type="button" class="chip wide" data-k="excludeAdult" aria-pressed="false">
        <span>Skip adult titles</span><span class="tick">✓</span>
      </button>
      <button type="button" class="chip wide" data-k="avoidRecent" aria-pressed="false">
        <span>Avoid last 40 picks</span><span class="tick">✓</span>
      </button>
    </div>
    <div class="p-lbl" style="padding-top: 5px;">Minimum rating</div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="panel">
    <div class="p-lbl">Click behaviour</div>
    <div class="seg" id="mode">
      <button type="button" data-v="card">Preview card</button>
      <button type="button" data-v="watch">Go to player</button>
    </div>
  </section>

  <div class="foot">
    <button class="btn" id="reset" type="button">Reset</button>
    <span id="status">Autosave</span>
  </div>

  <div class="hint"><b>Alt+R</b> rerolls on the site &nbsp;·&nbsp; <b>Esc</b> closes the card</div>

  <script src="popup.js"></script>
</body>
</html>
